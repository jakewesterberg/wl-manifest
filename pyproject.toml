[project]
name = "wl-manifest"
version = "0.1.0"
description = "The wl.yaml contract for Westerberg Lab packages"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wl-check = "wl_manifest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wl_manifest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
