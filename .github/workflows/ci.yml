name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q -ra
      - name: The contract does not import the lab
        run: |
          python - <<'PY'
          import pathlib, sys
          import wl_manifest
          root = pathlib.Path(wl_manifest.__file__).parent
          bad = [p for p in root.rglob("*.py") if "wl_orchestrator" in p.read_text()]
          if bad:
              print("wl_manifest must not import wl_orchestrator:", bad)
              sys.exit(1)
          print("direction holds")
          PY
      - name: It checks its own manifest
        run: wl-check .
