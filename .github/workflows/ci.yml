name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q -ra
      - name: The contract does not import the lab
        run: |
          ! python -c "import wl_manifest, wl_orchestrator" 2>/dev/null
      - name: It checks its own manifest
        run: wl-check .
